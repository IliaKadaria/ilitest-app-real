<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Liquidated" />
    <meta name="description" content="Day trading game: MetaTrader 5-style terminal, simulated markets." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Liquidated: Day Trading Game</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript><p style="color:#ececee;font:15px system-ui;padding:24px">Liquidated needs JavaScript. Please enable it and reload.</p></noscript>
    <script>
      // If the app script can't load at all (very old browser, blocked file), say so instead of a blank page.
      setTimeout(function () {
        var r = document.getElementById('root');
        if (r && !r.hasChildNodes()) r.innerHTML = '<div style="color:#ececee;font:15px system-ui;padding:32px 24px;max-width:420px"><b style="letter-spacing:.3em">LIQUIDATED</b><p>The game didn\'t start. Update your browser (Chrome, Safari or Firefox from 2023 or newer) and reload.</p><button onclick="location.reload()" style="padding:10px 16px;border-radius:10px">Reload</button></div>';
      }, 12000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

acing:1.5px;text-transform:uppercase;color:rgba(242,245,243,0.45);\">Training days / week<\/div>\n          <div style=\"margin-top:12px;display:flex;gap:8px;\">\n            <sc-for list=\"{{ dayOpts }}\" as=\"d\" hint-placeholder-count=\"5\">\n              <button onclick=\"{{ d.onClick }}\" style=\"flex:1;background:{{ d.bg }};color:{{ d.color }};border:none;border-radius:12px;padding:14px 0;font-family:'Space Grotesk';font-weight:700;font-size:16px;cursor:pointer;\">{{ d.d }}<\/button>\n            <\/sc-for>\n          <\/div>\n        <\/div>\n        <\/sc-if>\n\n        <sc-if value=\"{{ obResult }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"font-family:'JetBrains Mono';font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#3CE08A;\">Your blueprint<\/div>\n          <h2 style=\"font-family:'Space Grotesk';font-weight:700;font-size:28px;letter-spacing:-0.5px;margin:6px 0 0;\">Built for {{ goalLabel }}.<\/h2>\n          <div style=\"margin-top:20px;display:flex;flex-direction:column;gap:12px;\">\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;\">\n              <div style=\"background:#0E1110;border:1px solid rgba(60,224,138,0.2);border-radius:18px;padding:18px;\">\n                <div style=\"font-family:'JetBrains Mono';font-size:10px;letter-spacing:1px;text-transform:uppercase;color:rgba(242,245,243,0.45);\">Protein / day<\/div>\n                <div style=\"margin-top:8px;font-family:'Space Grotesk';font-weight:700;font-size:30px;color:#3CE08A;\">{{ proteinG }}<span style=\"font-size:15px;color:rgba(242,245,243,0.4);\"> g<\/span><\/div>\n              <\/div>\n              <div style=\"background:#0E1110;border:1px solid rgba(255,255,255,0.06);border-radius:18px;padding:18px;\">\n                <div style=\"font-family:'JetBrains Mono';font-size:10px;letter-spacing:1px;text-transform:uppercase;color:rgba(242,245,243,0.45);\">Calories / day<\/div>\n                <div style=\" px;display:grid;grid-template-columns:1fr 1fr;gap:12px;\">\n        <sc-for list=\"{{ stats }}\" as=\"s\" hint-placeholder-count=\"4\">\n          <div style=\"background:#0E1110;border:1px solid rgba(255,255,255,0.06);border-radius:18px;padding:16px;\">\n            <div style=\"font-family:'JetBrains Mono';font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:rgba(242,245,243,0.4);\">{{ s.label }}<\/div>\n            <div style=\"margin-top:8px;font-family:'Space Grotesk';font-weight:700;font-size:24px;letter-spacing:-0.5px;\">{{ s.value }}<\/div>\n            <div style=\"margin-top:2px;font-size:11.5px;color:{{ s.deltaColor }};\">{{ s.delta }}<\/div>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n\n      <!-- streak + rank row -->\n      <div style=\"margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px;\">\n        <div style=\"background:#0E1110;border:1px solid rgba(255,255,255,0.06);border-radius:18px;padding:16px;\">\n          <div style=\"display:flex;align-items:center;gap:7px;\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"#FF8C1A\" stroke=\"none\"><path d=\"M12 2c1.5 3 4 4.5 4 8a4 4 0 0 1-8 0c0-1.2.4-2 1-2.8C8 9 7 10.5 7 13a5 5 0 0 0 10 0c0-4.5-3-7-5-11z\"><\/path><\/svg>\n            <div style=\"font-family:'JetBrains Mono';font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:rgba(242,245,243,0.4);\">Streak<\/div>\n          <\/div>\n          <div style=\"margin-top:8px;font-family:'Space Grotesk';font-weight:700;font-size:26px;letter-spacing:-0.5px;\">{{ streak }}<span style=\"font-size:14px;color:rgba(242,245,243,0.45);font-weight:500;\"> days<\/span><\/div>\n          <div style=\"margin-top:6px;display:flex;gap:12px;\">\n            <div style=\"display:flex;align-items:center;gap:5px;\"><span style=\"width:9px;height:9px;border-radius:50%;background:{{ foodDot }};\"><\/span><span style=\"font-size:10.5px;color:rgba(242,245,243,0.5);\">Food<\/span><\/div>\n :rgba(60,224,138,0.13);border:1px solid rgba(60,224,138,0.25);display:flex;align-items:center;justify-content:center;flex-shrink:0;\">\n            <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3CE08A\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 6.5 17.5 17.5\"><\/path><path d=\"M21 21l-1-1\"><\/path><path d=\"M3 3l1 1\"><\/path><path d=\"m18 6 3-3\"><\/path><path d=\"M6 18l-3 3\"><\/path><rect x=\"5\" y=\"9\" width=\"4\" height=\"6\" rx=\"1\" transform=\"rotate(-45 7 12)\"><\/rect><rect x=\"15\" y=\"9\" width=\"4\" height=\"6\" rx=\"1\" transform=\"rotate(-45 17 12)\"><\/rect><\/svg>\n          <\/div>\n          <div style=\"flex:1;\">\n            <div style=\"font-family:'Space Grotesk';font-weight:700;font-size:17px;\">Workouts<\/div>\n            <div style=\"margin-top:3px;font-size:13px;color:rgba(242,245,243,0.55);line-height:1.4;\">Calisthenics skills &amp; gym lifts \u2014 with tutorials.<\/div>\n          <\/div>\n          <span style=\"color:#3CE08A;font-size:20px;flex-shrink:0;\">\u2192<\/span>\n        <\/div>\n      <\/div>\n      <div onclick=\"{{ openBoard }}\" style=\"margin-top:12px;position:relative;overflow:hidden;border-radius:20px;border:1px solid rgba(255,255,255,0.08);background:#0E1110;padding:20px;cursor:pointer;\">\n        <div style=\"position:relative;display:flex;align-items:center;gap:16px;\">\n          <div style=\"width:50px;height:50px;border-radius:15px;background:rgba(60,224,138,0.13);border:1px solid rgba(60,224,138,0.25);display:flex;align-items:center;justify-content:center;flex-shrink:0;\">\n            <svg width=\"23\" height=\"23\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3CE08A\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 21V9h8v12\"><\/path><path d=\"M4 21V13h4\"><\/path><path d=\"M16 21V5h4v16\"><\/path><path d=\"M3 21h18\"><\/path><\/svg>\n          <\/div>\n          <div style=\"flex:1;\">\n 42,245,243,0.55);\">Today's read<\/div>\n      <div onclick=\"{{ featuredView.onOpen }}\" style=\"margin-top:12px;border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,0.06);cursor:pointer;\">\n        <div style=\"height:130px;position:relative;background:#0b0e0d;background-image:repeating-linear-gradient(135deg, rgba(60,224,138,0.06) 0 14px, transparent 14px 28px);display:flex;align-items:center;justify-content:center;\">\n          <div style=\"width:52px;height:52px;border-radius:50%;background:rgba(60,224,138,0.95);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 30px rgba(60,224,138,0.3);\">\n            <div style=\"width:0;height:0;border-top:9px solid transparent;border-bottom:9px solid transparent;border-left:15px solid #06140D;margin-left:3px;\"><\/div>\n          <\/div>\n        <\/div>\n        <div style=\"padding:16px 18px;background:#0E1110;\">\n          <div style=\"font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:#3CE08A;\">{{ featuredView.cat }} \u00b7 {{ featuredView.read }}<\/div>\n          <div style=\"margin-top:7px;font-family:'Space Grotesk';font-weight:600;font-size:18px;line-height:1.2;letter-spacing:-0.3px;\">{{ featuredView.title }}<\/div>\n        <\/div>\n      <\/div>\n\n      <!-- scan cta -->\n      <button onclick=\"{{ goScan }}\" style=\"margin-top:18px;width:100%;background:#3CE08A;color:#06140D;font-family:'Space Grotesk';font-weight:700;font-size:16px;letter-spacing:0.2px;border:none;border-radius:16px;padding:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 10px 34px rgba(60,224,138,0.25);\">\n        Scan your next meal\n        <span style=\"font-size:18px;\">\u2192<\/span>\n      <\/button>\n    <\/div>\n    <\/sc-if>\n\n    <!-- ============ LEARN ============ -->\n    <sc-if value=\"{{ showLearn }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:60px 0 130px;\">\n      <div style=\"padding:0 20px;\">\n        <h1 style=\"font-family:'Space Grotesk';font-weight:700;font-size:30px;letter-spacing:-0.5px;margin:0;\">Learn<\/h1>\n        <div style=\"margin-top:6px;font-size:14px;color:rgba(242,245,243,0.5);\">Evidence-based. Zero bro-science.<\/div>\n      <\/div>\n      <div style=\"margin-top:18px;display:flex;gap:9px;overflow-x:auto;padding:0 20px;\">\n        <sc-for list=\"{{ catsView }}\" as=\"c\" hint-placeholder-count=\"5\">\n          <button onclick=\"{{ c.onClick }}\" style=\"flex-shrink:0;background:{{ c.bg }};color:{{ c.color }};border:1px solid {{ c.border }};border-radius:999px;padding:9px 16px;font-family:'Space Grotesk';font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;\">{{ c.label }}<\/button>\n        <\/sc-for>\n      <\/div>\n      <div style=\"margin-top:18px;padding:0 20px;display:flex;flex-direction:column;gap:12px;\">\n        <sc-for list=\"{{ articlesView }}\" as=\"a\" hint-placeholder-count=\"6\">\n          <div onclick=\"{{ a.onOpen }}\" style=\"display:flex;gap:14px;background:#0E1110;border:1px solid rgba(255,255,255,0.06);border-radius:18px;padding:12px;cursor:pointer;align-items:center;\">\n            <div style=\"width:88px;height:74px;flex-shrink:0;position:relative;\">\n              <image-slot id=\"{{ a.imgSlotId }}\" shape=\"rounded\" radius=\"13\" placeholder=\"{{ a.photoHint }}\" style=\"width:88px;height:74px;display:block;\"><\/image-slot>\n              <sc-if value=\"{{ a.isVideo }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;\">\n                  <div style=\"width:32px;height:32px;border-radius:50%;background:rgba(60,224,138,0.92);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,0.45);\">\n                    <div style=\"width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:9px solid #06140D;margin-left:2px;\"><\/div>\n                  <\/div>\n                <\/div>\n              <\/sc-if>\n            <\/div>\n            <div style=\"flex:1;min-width:0;\">\n              <div style=\"font-family:'JetBrains Mono';font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#3CE08A;\">{{ a.cat }}<\/div>\n              <div style=\"margin-top:5px;font-family:'Space Grotesk';font-weight:600;font-size:15.5px;line-height:1.22;letter-spacing:-0.2px;\">{{ a.title }}<\/div>\n              <div style=\"margin-top:6px;font-family:'JetBrains Mono';font-size:10.5px;color:rgba(242,245,243,0.4);\">{{ a.typeLabel }} \u00b7 {{ a.read }}<\/div>\n            <\/div>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n    <\/div>\n    <\/sc-if>\n\n    <!-- ============ SCAN ============ -->\n    <sc-if value=\"{{ showScan }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:60px 20px 130px;\">\n\n      <sc-if value=\"{{ scanIdle }}\" hint-placeholder-val=\"{{ true }}\">\n      <div>\n        <h1 style=\"font-family:'Space Grotesk';font-weight:700;font-size:30px;letter-spacing:-0.5px;margin:0;\">Scan a Meal<\/h1>\n        <div style=\"margin-top:6px;font-size:14px;color:rgba(242,245,243,0.5);\">Snap your plate. Get the testosterone verdict.<\/div>\n\n        <div style=\"margin-top:22px;border-radius:24px;border:1.5px dashed rgba(60,224,138,0.3);background:#0b0e0d;background-image:repeating-linear-gradient(135deg, rgba(60,224,138,0.05) 0 16px, transparent 16px 32px);padding:40px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;\">\n          <div style=\"width:74px;height:74px;border-radius:22px;background:rgba(60,224,138,0.12);border:1px solid rgba(60,224,138,0.25);display:flex;align-items:center;justify-content:center;\">\n            <svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3CE08A\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 8a2 2 0 0 1 2-2h1.5l1-1.5a1 1 0 0 1 .8-.5h3.4a1 1 0 0 1 .8.5l1 1.5H17a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z\"><\/path><circle cx=\"11\" cy=\"12\" r=\"3.4\"><\/circle><\/svg>\n          <\/div>\n          <div style=\"margin-top:16px;font-family:'Space Grotesk';font-weight:600;font-size:16px;\">Point at your plate<\/div>\n          <div style=\"margin-top:6px;font-size:13px;color:rgba(242,245,243,0.45);line-height:1.4;max-width:230px;\">AI reads your calories, protein, carbs, fat &amp; sugar \u2014 then scores it for T.<\/div>\n        <\/div>\n\n        <button onclick=\"{{ openCameraFood }}\" style=\"margin-top:16px;width:100%;box-sizing:border-box;background:#3CE08A;color:#06140D;font-family:'Space Grotesk';font-weight:700;font-size:16px;border:none;border-radius:16px;padding:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 10px 34px rgba(60,224,138,0.25);\">\n          <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#06140D\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 8a2 2 0 0 1 2-2h1.5l1-1.5a1 1 0 0 1 .8-.5h3.4a1 1 0 0 1 .8.5l1 1.5H17a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z\"><\/path><circle cx=\"11\" cy=\"12\" r=\"3.4\"><\/circle><\/svg>\n          Take Photo\n        <\/button>\n        <label style=\"margin-top:10px;width:100%;box-sizing:border-box;background:rgba(255,255,255,0.05);color:#F2F5F3;border:1px solid rgba(255,255,255,0.1);font-family:'Space Grotesk';font-weight:500;font-size:15px;border-radius:16px;padding:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;\">\n          Upload from library\n          <input type=\"file\" accept=\"image/*\" onchange=\"{{ onPick }}\" style=\"display:none\">\n        <\/label>\n\n        <div style=\"margin-top:26px;font-family:'Space Grotesk';font-weight:600;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:rgba(242,245,243,0.45);\">How it works<\/div>\n        <div style=\"margin-top:12px;display:flex;flex-direction:column;gap:10px;\">\n          <sc-for list=\"{{ steps }}\" as=\"st\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;gap:13px;align-items:center;background:#0E1110;border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:13px 15px;\">\n              <div style=\"width:26px;height:26px;border-radius:50%;background:rgba(60,224,138,0.13);color:#3CE08A;font-family:'JetBrains Mono';font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;\">{{ st.n }}<\/div>\n              <div style=\"font-size:13.5px;color:rgba(242,245,243,0.75);\">{{ st.text }}<\/div>\n            <\/div>\n          <\/sc-for>\n        <\/div>\n      <\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{ scanAnalyzing }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;align-items:center;padding-top:8px;\">\n        <div style=\"width:100%;aspect-ratio:1/1;border-radius:24px;overflow:hidden;position:relative;border:1px solid rgba(60,224,138,0.25);\">\n          {{ scanImgAnalyze }}\n          <div style=\"position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#3CE08A,transparent);box-shadow:0 0 18px 3px rgba(60,224,138,0.6);animation:apxScan 1.8s ease-in-out infinite;\"><\/div>\n          <div style=\"position:absolute;inset:0;border:1px solid rgba(60,224,138,0.12);\"><\/div>\n        <\/div>\n        <div style=\"margin-top:22px;display:flex;align-items:center;gap:11px;\">\n          <div style=\"width:18px;height:18px;border:2px solid rgba(60,224,138,0.25);border-top-color:#3CE08A;border-radius:50%;animation:apxSpin .8s linear infinite;\"><\/div>\n          <div style=\"font-family:'Space Grotesk';font-weight:600;font-size:16px;\">Analyzing your meal\u2026<\/div>\n        <\/div>\n        <div style=\"margin-top:8px;font-family:'JetBrains Mono';font-si order-radius:16px;padding:15px;\">\n              <div style=\"display:flex;align-items:center;gap:7px;\">\n                <div style=\"width:7px;height:7px;border-radius:50%;background:{{ m.color }};\"><\/div>\n                <div style=\"font-family:'JetBrains Mono';font-size:10px;letter-spacing:1px;text-transform:uppercase;color:rgba(242,245,243,0.45);\">{{ m.key }}<\/div>\n              <\/div>\n              <div style=\"margin-top:8px;font-family:'Space Grotesk';font-weight:700;font-size:22px;letter-spacing:-0.5px;\">{{ m.value }}<\/div>\n              <div style=\"margin-top:4px;font-size:11.5px;line-height:1.35;color:rgba(242,245,243,0.5);\">{{ m.note }}<\/div>\n            <\/div>\n          <\/sc-for>\n        <\/div>\n\n        <!-- tips -->\n        <div style=\"margin-top:18px;font-family:'Space Grotesk';font-weight:600;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:rgba(242,245,243,0.45);\">Make it better<\/div>\n        <div style=\"margin-top:10px;display:flex;flex-direction:column;gap:10px;\">\n          <sc-for list=\"{{ scanData.tips }}\" as=\"tip\" hint-placeholder-count=\"2\">\n            <div style=\"display:flex;gap:11px;align-items:flex-start;background:rgba(60,224,138,0.06);border:1px solid rgba(60,224,138,0.14);border-radius:14px;padding:13px 15px;\">\n              <span style=\"color:#3CE08A;font-weight:700;flex-shrink:0;\">+<\/span>\n              <div style=\"font-size:13.5px;line-height:1.45;color:rgba(242,245,243,0.82);\">{{ tip }}<\/div>\n            <\/div>\n          <\/sc-for>\n        <\/div>\n\n        <button onclick=\"{{ resetScan }}\" style=\"margin-top:20px;width:100%;background:rgba(255,255,255,0.05);color:#F2F5F3;border:1px solid rgba(255,255,255,0.1);font-family:'Space Grotesk';font-weight:600;font-size:15px;border-radius:16px;padding:15px;cursor:pointer;\">Scan another meal<\/button>\n        <div style=\"margin-top:12px;font-family:'JetBrains Mono';font-size:9.5px;line-height:1.4;color:rgba(242,245,243,0.3);text-align:center;\">AI estimates from a photo \u2014 treat as guidance, not a lab measurement.<\/div>\n      <\/div>\n      <\/sc-if>\n\n    <\/div>\n    <\/sc-if>\n\n    <!-- ============ PROFILE ============ -->\n    <sc-if value=\"{{ showProfile }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:60px 20px 130px;\">\n      <div style=\"display:flex;align-items:center;gap:16px;\">\n        <div style=\"width:68px;height:68px;border-radius:22px;background:linear-gradient(145deg,#3CE08A,#1c7a4a);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;font-size:26px;color:#06140D;flex-shrink:0;\">AM<\/div>\n        <div>\n          <div style=\"font-family:'Space Grotesk';font-weight:700;font-size:22px;letter-spacing:-0.3px;\">Alex Mercer<\/div>\n          <div style=\"margin-top:4px;display:inline-flex;align-items:center;gap:7px;font-family:'JetBrains Mono';font-size:11px;color:#3CE08A;background:rgba(60,224,138,0.1);padding:4px 10px;border-radius:999px;\">\u25b2 {{ streakLabel }}<\/div>\n        <\/div>\n      <\/div>\n\n      <div style=\"margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:12px;\">\n        <sc-for list=\"{{ bodyStats }}\" as=\"b\" hint-placeholder-count=\"4\">\n          <div style=\"background:#0E1110;border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:15px;\">\n            <div style=\"font-family:'JetBrains Mono';font-size:10px;letter-spacing:1px;text-transform:uppercase;color:rgba(242,245,243,0.4);\">{{ b.label }}<\/div>\n            <div style=\"margin-top:7px;font-family:'Space Grotesk';font-weight:700;font-size:22px;letter-spacing:-0.5px;\">{{ b.value }}<\/div>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n\n      <div style=\"margin-top:14px;background:linear-gradient(160deg,#0f1513,#0b0e0d);border:1px solid rgba(60,224,138,0.16);border-radius:20px;padding:20px;\">\n        <div style=\"display:flex;align-items:center;justify-content:s );border:1px solid rgba(240,84,79,0.25);color:#F0544F;font-family:'Space Grotesk';font-weight:600;font-size:14px;border-radius:14px;padding:14px;cursor:pointer;\">Log out<\/button>\n    <\/div>\n    <\/sc-if>\n\n    <!-- ============ DIARY ============ -->\n    <sc-if value=\"{{ showLog }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:60px 20px 130px;\">\n      <h1 style=\"font-family:'Space Grotesk';font-weight:700;font-size:30px;letter-spacing:-0.5px;margin:0;\">Today<\/h1>\n      <div style=\"margin-top:6px;font-family:'JetBrains Mono';font-size:11px;letter-spacing:1.5px;color:rgba(242,245,243,0.4);text-transform:uppercase;\">{{ todayLabel }}<\/div>\n\n      <!-- summary -->\n      <div style=\"margin-top:18px;background:linear-gradient(160deg,#0f1513,#0b0e0d);border:1px solid rgba(60,224,138,0.16);border-radius:22px;padding:20px;\">\n        <div style=\"display:flex;align-items:flex-end;justify-content:space-between;\">\n          <div>\n            <div style=\"font-family:'JetBrains Mono';font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(242,245,243,0.45);\">Calories<\/div>\n            <div style=\"margin-top:6px;display:flex;align-items:baseline;gap:6px;\"><span style=\"font-family:'Space Grotesk';font-weight:700;font-size:34px;letter-spacing:-1px;\">{{ calEaten }}<\/span><span style=\"font-family:'JetBrains Mono';font-size:13px;color:rgba(242,245,243,0.4);\">/ {{ calTarget }}<\/span><\/div>\n          <\/div>\n          <div style=\"text-align:right;\">\n            <div style=\"font-family:'Space Grotesk';font-weight:600;font-size:13px;color:{{ remainColor }};\">{{ calRemaining }}<\/div>\n            <div style=\"font-family:'JetBrains Mono';font-size:10px;color:rgba(242,245,243,0.4);\">remaining<\/div>\n          <\/div>\n        <\/div>\n        <div style=\"margin-top:12px;height:8px;border-radius:999px;background:rgba(255,255,255,0.08);overflow:hidden;\"><div style=\"height:100%;width:{{ calPct }};background:# round:rgba(242,245,243,0.45);\"><\/div><\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <!-- search -->\n      <div style=\"margin-top:20px;position:relative;\">\n        <div style=\"position:absolute;left:16px;top:50%;transform:translateY(-50%);pointer-events:none;\">\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"rgba(242,245,243,0.4)\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\/circle><path d=\"M21 21l-4.3-4.3\"><\/path><\/svg>\n        <\/div>\n        <input type=\"text\" value=\"{{ query }}\" onchange=\"{{ onSearch }}\" placeholder=\"Search any food, ingredient or recipe\u2026\" style=\"width:100%;box-sizing:border-box;background:#0E1110;border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:15px 44px;color:#F2F5F3;font-family:Archivo;font-size:15px;outline:none;\">\n        <sc-if value=\"{{ hasQuery }}\" hint-placeholder-val=\"{{ false }}\">\n          <button onclick=\"{{ clearQuery }}\" style=\"position:absolute;right:10px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.08);border:none;color:rgba(242,245,243,0.6);width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:14px;\">\u00d7<\/button>\n        <\/sc-if>\n      <\/div>\n\n      <!-- results -->\n      <sc-if value=\"{{ hasQuery }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:10px;background:#0E1110;border:1px solid rgba(255,255,255,0.07);border-radius:16px;overflow:hidden;\">\n        <sc-for list=\"{{ foodResults }}\" as=\"r\" hint-placeholder-count=\"4\">\n          <div onclick=\"{{ r.onAdd }}\" style=\"display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid rgba(255,255,255,0.05);cursor:pointer;\">\n            <div style=\"flex:1;min-width:0;\">\n              <div style=\"display:flex;align-items:center;gap:8px;\"><span style=\"font-family:'Space Grotesk';font-weight:600;font-size:15px;\">{{ r.n }}<\/span><span style=\"font-family:'JetBrains Mono';font-size:9px;letter-spacing:0.5px;text-transform:uppercase;color:{{ r.tagColor }};border:1px solid {{ r.tagBorder }};border-radius:4px;padding:1px 5px;\">{{ r.cat }}<\/span><\/div>\n              <div style=\"margin-top:3px;font-size:11.5px;color:rgba(242,245,243,0.45);\">{{ r.s }} \u00b7 P{{ r.p }} C{{ r.c }} F{{ r.f }}<\/div>\n            <\/div>\n            <div style=\"font-family:'Space Grotesk';font-weight:700;font-size:16px;flex-shrink:0;\">{{ r.k }}<span style=\"font-size:10px;color:rgba(242,245,243,0.4);\"> kcal<\/span><\/div>\n            <div style=\"width:26px;height:26px;border-radius:8px;background:rgba(60,224,138,0.14);color:#3CE08A;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0;\">+<\/div>\n          <\/div>\n        <\/sc-for>\n        <sc-if value=\"{{ showAskAI }}\" hint-placeholder-val=\"{{ true }}\">\n          <div onclick=\"{{ askAI }}\" style=\"display:flex;align-items:center;gap:11px;padding:14px 15px;cursor:pointer;background:rgba(60,224,138,0.05);\">\n            <sc-if value=\"{{ aiLoading }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"width:17px;height:17px;border:2px solid rgba(60,224,138,0.25);border-top-color:#3CE08A;border-radius:50%;animation:apxSpin .8s linear infinite;flex-shrink:0;\"><\/div>\n            <\/sc-if>\n            <sc-if value=\"{{ aiIdle }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"width:22px;height:22px;border-radius:7px;background:#3CE08A;color:#06140D;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;font-size:12px;flex-shrink:0;\">I<\/div>\n            <\/sc-if>\n            <div style=\"flex:1;font-size:13.5px;color:rgba(242,245,243,0.8);\">{{ askLabel }}<\/div>\n          <\/div>\n        <\/sc-if>\n      <\/div>\n      <\/sc-if>\n\n      <!-- log list -->\n      <div style=\"margin-top:22px;display:flex;align-items:center;justify-content:space-between;\">\n        <div style=\"font-family:'Space Grotesk';font-weight:600;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:rgba(242,245,243,0.55);\">Logged today<\/div>\n        <div style=\"font-family:'JetBrains Mono';font-size:12px;color:rgba(242,245,243,0.4);\">{{ logCount }} items<\/div>\n      <\/div>\n\n      <sc-if value=\"{{ hasLog }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:12px;display:flex;flex-direction:column;gap:8px;\">\n        <sc-for list=\"{{ logView }}\" as=\"e\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;align-items:center;gap:12px;background:#0E1110;border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:13px 15px;\">\n            <div style=\"flex:1;min-width:0;\">\n              <div style=\"font-family:'Space Grotesk';font-weight:600;font-size:15px;\">{{ e.n }}<\/div>\n              <div style=\"margin-top:2px;font-size:11.5px;color:rgba(242,245,243,0.45);\">{{ e.s }} \u00b7 P{{ e.p }} C{{ e.c }} F{{ e.f }}<\/div>\n            <\/div>\n            <div style=\"font-family:'Space Grotesk';font-weight:700;font-size:15px;flex-shrink:0;\">{{ e.k }}<span style=\"font-size:10px;color:rgba(242,245,243,0.4);\"> kcal<\/span><\/div>\n            <button onclick=\"{{ e.onRemove }}\" style=\"background:none;border:none;color:rgba(242,245,243,0.35);font-size:20px;cursor:pointer;flex-shrink:0;line-height:1;\">\u00d7<\/button>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{ logEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"margin-top:12px;background:#0E1110;border:1px dashed rgba(255,255,255,0.1);border-radius:16px;padding:32px 20px;text-align:center;\">\n        <div style=\"font-size:14px;color:rgba(242,245,243,0.5);line-height:1.5;\">Nothing logged yet.<br>Search above to add your first meal.<\/div>\n      <\/div>\n      <\/sc-if>\n    <\/div>\n    <\/sc-if>\n\n  <\/div>\n\n  <!-- ============ LIVE CAMERA OVERLAY ============ -->\n  <sc-if value=\"{{ camOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:absolute;inset:0;z-index:80;background:#000;display:flex;flex-direction:column;\">\n    <div style=\"position:relative;flex:1;overflow:hidden;background:#000;\">\n      <video ref=\"{{ setCamVideo }}\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:{{ camMirror }};\"><\/video>\n\n      <!-- framing guide -->\n      <sc-if value=\"{{ camReady }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;pointer-events:none;\">\n        <div style=\"position:absolute;top:14%;bottom:14%;left:14%;right:14%;border-radius:24px;border:1.5px solid rgba(255,255,255,0.35);box-shadow:0 0 0 9999px rgba(0,0,0,0.28);\"><\/div>\n        <div style=\"position:absolute;left:0;right:0;bottom:18%;text-align:center;font-family:'JetBrains Mono';font-size:11px;letter-spacing:1px;color:rgba(255,255,255,0.85);text-shadow:0 1px 4px rgba(0,0,0,0.6);\">{{ camHint }}<\/div>\n      <\/div>\n      <\/sc-if>\n\n      <!-- loading -->\n      <sc-if value=\"{{ camLoading }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;\">\n        <div style=\"width:22px;height:22px;border:2px solid rgba(255,255,255,0.25);border-top-color:#3CE08A;border-radius:50%;animation:apxSpin .8s linear infinite;\"><\/div>\n        <div style=\"font-family:'Space Grotesk';font-size:14px;color:rgba(255,255,255,0.7);\">Starting camera\u2026<\/div>\n      <\/div>\n      <\/sc-if>\n\n      <!-- error -->\n      <sc-if value=\"{{ camDenied }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:34px;text-align:center;color:#fff;\">\n        <div style=\"width:60px;height:60px;border-radius:18px;background:rgba(240,84,79,0.15);border:1px solid rgba(240,84,79,0.35);display:flex;align-items:center;justify-content:center;\">\n          <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#F0544F\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 8a2 2 0 0 1 2-2h1.5l1-1.5a1 1 0 0 1 .8-.5h3.4a1 1 0 0 1 .8.5l1 1.5H17a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z\"><\/path><circle cx=\"11\" cy=\"12\" r=\"3.4\"><\/circle><path d=\"m2 2 20 20\"><\/path><\/svg>\n        <\/div>\n        <div style=\"font-family:'Space Grotesk';font-weight:600;font-size:17px;\">Camera unavailable<\/div>\n        <div style=\"font-size:13px;line-height:1.5;color:rgba(255,255,255,0.6);max-width:260px;\">Allow camera access in your browser, or use \u201cUpload from library\u201d instead.<\/div>\n        <label style=\"margin-top:6px;background:#3CE08A;color:#06140D;font-family:'Space Grotesk';font-weight:700;font-size:14px;border-radius:12px;padding:12px 22px;cursor:pointer;\">\n          Upload instead\n          <input type=\"file\" accept=\"image/*\" onchange=\"{{ onPickCam }}\" style=\"display:none\">\n        <\/label>\n      <\/div>\n      <\/sc-if>\n\n      <!-- top bar -->\n      <div style=\"position:absolute;top:0;left:0;right:0;padding:54px 20px 0;display:flex;align-items:center;justify-content:space-between;\">\n        <button onclick=\"{{ closeCamera }}\" style=\"background:rgba(0,0,0,0.4);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.15);color:#fff;border-radius:999px;width:42px;height:42px;font-size:19px;cursor:pointer;\">\u00d7<\/button>\n        <div style=\"font-family:'JetBrains Mono';font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.85);background:rgba(0,0,0,0.4);backdrop-filter:blur(8px);padding:7px 13px;border-radius:999px;\">{{ camTitle }}<\/div>\n        <button onclick=\"{{ flipCamera }}\" style=\"background:rgba(0,0,0,0.4);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.15);color:#fff;border-radius:999px;width:42px;height:42px;cursor:pointer;display:flex;align-items:center;justify-content:center;\">\n          <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12a9 9 0 0 1 9-9 9 9 0 0 1 6.7 3\"><\/path><path d=\"M21 3v5h-5\"><\/path><path d=\"M21 12a9 9 0 0 1-9 9 9 9 0 0 1-6.7-3\"><\/path><path d=\"M3 21v-5h5\"><\/path><\/svg>\n        <\/button>\n      <\/div>\n    <\/div>\n\n    <!-- shutter bar -->\n    <div style=\"background:#000;padding:22px 20px 40px;display:flex;align-items:center;justify-content:center;\">\n      <button onclick=\"{{ shootCamera }}\" style=\"width:74px;height:74px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,0.35);cursor:pointer;box-shadow:0 0 0 2px #000 inset;\"><\/button>\n    <\/div>\n  <\/div>\n  <\/sc-if>\n\n  <!-- ============ BODY SCAN OVERLAY ============ -->\n  <sc-if value=\"{{ bodyOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:absolute;inset:0;z-index:60;background:radial-gradient(circle at 50% 0%, #0d1c1e, #060807 60%);color:#F2F5F3;overflow-y:auto;\">\n    <div style=\"padding:64px 22px 48px;\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;\">\n        <div style=\"font-family:'JetBrains Mono';font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#3CE08A;\">Body-Fat Scan<\/div>\n        <button onclick=\"{{ closeBodyScan }}\" style=\"background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.09);color:#F2F5F3;border-radius:999px;width:38px;height:38px;font-size:17px;cursor:pointer;\">\u00d7<\/button>\n      <\/div>\n\n      <!-- IDLE -->\n      <sc-if value=\"{{ bodyIdle }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"margin-top:14px;\">\n        <h1 style=\"font-family:'Space Grotesk';font-weight:700;font-size:30px;letter-spacing:-0.6px;margin:0;line-height:1.08;\">Read your body fat from a photo.<\/h1>\n        <p style=\"margin:10px 0 0;font-size:14px;line-height:1.55;color:rgba(242,245,243,0.55);\">Our vision model reads visible muscle definition, vascularity and fat distribution to estimate your body-fat percentage \u2014 the single best photo-based estimate you can get without a lab.<\/p>\n\n        <div style=\"margin-top:22px;border-radius:24px;border:1.5px dashed rgba(60,224,138,0.3);background:#0b0e0d;background-image:repeating-linear-gradient(135deg, rgba(60,224,138,0.05) 0 16px, transparent 16px 32px);padding:34px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;\">\n          <div style=\"width:74px;height:74px;border-radius:22px;background:rgba(60,224,138,0.12);border:1px solid rgba(60,224,138,0.25);display:flex;align-items:center;justify-content:center;\">\n            <svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3CE08A\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"5\" r=\"2.6\"><\/circle><path d=\"M12 7.6v8\"><\/path><path d=\"M12 9.6 6.5 12.5\"><\/path><path d=\"m12 9.6 5.5 2.9\"><\/path><path d=\"M12 15.6 8 21.5\"><\/path><path d=\"m12 15.6 4 5.9\"><\/path><\/svg>\n          <\/div>\n          <div style=\"margin-top:16px;font-family:'Space Grotesk';font-weight:600;font-size:16px;\">Front-on, good light, fitted clothing<\/div>\n          <div style=\"margin-top:6px;font-size:13px;color:rgba(242,245,243,0.45);line-height:1.45;max-width:250px;\">A relaxed standing shot from the front (shirtless or fitted top) gives the most accurate read.<\/div>\n        <\/div>\n\n        <button onclick=\"{{ openCameraBody }}\" style=\"margin-top:16px;width:100%;box-sizing:border-box;background:#3CE08A;color:#06140D;font-family:'Space Grotesk';font-weight:700;font-size:16px;border:none;border-radius:16px;padding:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 10px 34px rgba(60,224,138,0.25);\">\n          <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#06140D\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 8a2 2 0 0 1 2-2h1.5l1-1.5a1 1 0 0 1 .8-.5h3.4a1 1 0 0 1 .8.5l1 1.5H17a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z\"><\/path><circle cx=\"11\" cy=\"12\" r=\"3.4\"><\/circle><\/svg>\n          Take Photo\n        <\/button>\n        <label style=\"margin-top:10px;width:100%;box-sizing:border-box;background:rgba(255,255,255,0.05);color:#F2F5F3;border:1px solid rgba(255,255,255,0.1);font-family:'Space Grotesk';font-weight:500;font-size:15px;border-radius:16px;padding:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;\">\n          Upload from library\n          <input type=\"file\" accept=\"image/*\" onchange=\"{{ onPickBody }}\" style=\"display:none\">\n        <\/label>\n\n        <div style=\"margin-top:20px;display:flex;gap:11px;align-items:flex-start;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:13px 15px;\">\n          <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"rgba(242,245,243,0.5)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink:0;margin-top:1px;\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"11\" rx=\"2\"><\/rect><path d=\"M7 11V7a5 5 0 0 1 10 0v4\"><\/path><\/svg>\n          <div style=\"font-size:12.5px;line-height:1.45;color:rgba(242,245,243,0.5);\">Your photo is analyzed for this estimate only and never leaves your session. Nothing is stored or shared.<\/div>\n        <\/div>\n      <\/div>\n      <\/sc-if>\n\n      <!-- ANALYZING -->\n      <sc-if value=\"{{ bodyAnalyzing }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;align-items:center;padding-top:18px;\">\n        <div style=\"width:78%;aspect-ratio:3/4;border-radius:24px;overflow:hidden;position:relative;border:1px solid rgba(60,224,138,0.25);\">\n          {{ bodyImgAnalyze }}\n          <div style=\"position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#3CE08A,transparent);box-shadow:0 0 18px 3px rgba(60,224,138,0.6);animation:apxScan 1.8s ease-in-out infinite;\"><\/div>\n          <div style=\"position:absolute;inset:0;border:1px solid rgba(60,224,138,0.12);\"><\/div>\n        <\/div>\n        <div style=\"margin-top:24px;display:flex;align-items:center;gap:11px;\">\n          <div style=\"width:18px;height:18px;border:2px solid rgba(60,224,138,0.25);border-top-color:#3CE08A;border-radius:50%;animation:apxSpin .8s linear infinite;\"><\/div>\n          <div style=\"font-family:'Space Grotesk';font-weight:600;font-size:16px;\">Reading your physique\u2026<\/div>\n        <\/div>\n        <div style=\"margin-top:8px;font-family:'JetBrains Mono';font-size:11px;letter-spacing:0.5px;color:rgba(242,245,243,0.4);animation:apxPulse 1.5s ease-in-out infinite;\">Mapping definition, vascularity &amp; fat distribution<\/div>\n      <\/div>\n      <\/sc-if>\n\n      <!-- ERROR -->\n      <sc-if value=\"{{ bodyError }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding-top:46px;text-align:center;\">\n        <div style=\"width:64px;height:64px;border-radius:20px;margin:0 auto;background:rgba(240,84,79,0.12);border:1px solid rgba(240,84,79,0.3);display:flex;align-items:center;justify-content:center;font-size:30px;color:#F0544F;\">!<\/div>\n        <div style=\"margin-top:18px;font-family:'Space Grotesk';font-weight:600;font-size:18px;\">Couldn't read that one<\/div>\n        <div style=\"margin-top:8px;font-size:13.5px;color:rgba(242,245,243,0.5);line-height:1.5;max-width:270px;margin-left:auto;margin-right:auto;\">Use a clear, well-lit, front-on photo where your torso is visible. Avoid baggy clothing and busy backgrounds.<\/div>\n        <button onclick=\"{{ retryBody }}\" style=\"margin-top:22px;background:#3CE08A;color:#06140D;font-family:'Space Grotesk';font-weight:700;font-size:15px;border:none;border-radius:14px;padding:14px 28px;cursor:pointer;\">Try again<\/button>\n        <button onclick=\"{{ resetBodyScan }}\" style=\"margin-top:10px;display:block;margin-left:auto;margin-right:auto;background:none;border:none;color:rgba(242,245,243,0.5);font-family:'Space Grotesk';font-size:14px;cursor:pointer;\">Start over<\/button>\n      <\/div>\n      <\/sc-if>\n\n      <!-- DONE -->\n      <sc-if value=\"{{ bodyDone }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:14px;\">\n        <!-- hero estimate -->\n        <div style=\"border-radius:24px;border:1px solid {{ bodyColorBorder }};background:linear-gradient(160deg,#0e1a16,#0a0d0c);padding:24px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;overflow:hidden;\">\n          <div style=\"position:absolute;top:-40px;right:-30px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,{{ bodyGlow }},transparent 70%);\"><\/div>\n          <div style=\"position:relative;font-family:'JetBrains Mono';font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(242,245,243,0.5);\">Estimated body fat<\/div>\n          <div style=\"position:relative;margin-top:8px;display:flex;align-items:flex-start;gap:3px;\">\n            <span style=\"font-family:'Space Grotesk';font-weight:700;font-size:64px;line-height:0.9;letter-spacing:-2px;color:{{ bodyColor }};\">{{ bodyData.bodyFat }}<\/span>\n            <span style=\"font-family:'Space Grotesk';font-weight:700;font-size:26px;color:{{ bodyColor }};margin-top:4px;\">%<\/span>\n          <\/div>\n          <div style=\"position:relative;margin-top:6px;font-family:'JetBrains Mono';font-size:12px;color:rgba(242,245,243,0.55);\">likely range {{ bodyData.range }}<\/div>\n          <div style=\"position:relative;margin-top:14px;display:inline-flex;align-items:center;gap:7px;background:{{ bodyColorSoft }};border:1px solid {{ bodyColorBorder }};border-radius:999px;padding:6px 14px;\">\n            <span style=\"font-family:'Space Grotesk';font-weight:700;font-size:13px;color:{{ bodyColor }};\">{{ bodyData.category }}<\/span>\n          <\/div>\n        <\/div>\n\n        <!-- scale -->\n        <div style=\"margin-top:16px;background:#0E1110;border:1px solid rgba(255,255,255,0.06);border-radius:20px;padding:20px 18px;\">\n          <div style=\"font-family:'JetBrains Mono';font-size:10px;letter-spacing:1px;text-transform:uppercase;color:rgba(242,245,243,0.45);\">Where you land (men)<\/div>\n          <div style=\"margin-top:18px;position:relative;height:10px;border-radius:999px;background:linear-gradient(90deg,#3CE08A 0%,#8FD14F 28%,#E8B23A 58%,#F0544F 100%);\">\n            <div style=\"position:absolute;top:50%;left:{{ bodyMarkerPct }};transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;background:#F2F5F3;border:3px solid #060807;box-shadow:0 2px 8px rgba(0,0,0,0.5);\"><\/div>\n          <\/div>\n          <div style=\"margin-top:10px;display:flex;justify-content:space-between;font-family:'JetBrains Mono';font-size:9px;color:rgba(242,245,243,0.4);\">\n            <span>6%<\/span><span>13%<\/span><span>20%<\/span><span>30%+<\/span>\n          <\/div>\n          <div style=\"margin-top:6px;display:flex;justify-content:space-between;font-family:'Space Grotesk';font-size:9.5px;font-weight:600;color:rgba(242,245,243,0.35);text-transform:uppercase;letter-spacing:0.5px;\">\n            <span>Athletic<\/span><span>Fit<\/span><span>Average<\/span><span>High<\/span>\n          <\/div>\n        <\/div>\n\n        <!-- summary -->\n        <div style=\"margin-top:16px;background:#0E1110;border:1px solid rgba(255,255,255,0.06);border-radius:20px;padding:18px;\">\n          <div style=\"font-size:14px;line-height:1.55;color:rgba(242,245,243,0.82);\">{{ bodyData.summary }}<\/div>\n          <div style=\"margin-top:14px;display:flex;gap:14px;\">\n            <div style=\"flex:1;\">\n              <div style=\"font-family:'JetBrains Mono';font-size:9px;letter-spacing:1px;text-transform:uppercase;color:rgba(242,245,243,0.4);\">Est. lean mass<\/div>\n              <div style=\"margin-top:4px;font-family:'Space Grotesk';font-weight:700;font-size:18px;\">{{ bodyData.leanMass }}<\/div>\n            <\/div>\n            <div style=\"flex:1;\">\n              <div style=\"font-family:'JetBrains Mono';font-size:9px;letter-spacing:1px;text-transform:uppercase;color:rgba(242,245,243,0.4);\">Est. fat mass<\/div>\n              <div style=\"margin-top:4px;font-family:'Space Grotesk';font-weight:700;font-size:18px;\">{{ bodyData.fatMass }}<\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <!-- what the AI saw -->\n        <div style=\"margin-top:18px;font-family:'Space Grotesk';font-weight:600;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:rgba(242,245,243,0.45);\">What the scan saw<\/div>\n        <div style=\"margin-top:10px;display:flex;flex-direction:column;gap:10px;\">\n          <sc-for list=\"{{ bodyData.cues }}\" as=\"cue\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;gap:11px;align-items:flex-start;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:13px 15px;\">\n              <span style=\"color:#3CE08A;flex-shrink:0;font-size:15px;line-height:1.3;\">\u2022<\/span>\n              <div style=\"font-size:13.5px;line-height:1.45;color:rgba(242,245,243,0.78);\">{{ cue }}<\/div>\n            <\/div>\n          <\/sc-for>\n        <\/div>\n\n        <!-- tips -->\n        <div style=\"margin-top:18px;font-family:'Space Grotesk';font-weight:600;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:rgba(242,245,243,0.45);\">Your next move<\/div>\n        <div style=\"margin-top:10px;display:flex;flex-direction:column;gap:10px; ont-family:'JetBrains Mono';font-size:10px;letter-spacing:1px;text-transform:uppercase;color:rgba(242,245,243,0.45);\">{{ svcName }} \u00b7 Connected<\/div>\n            <div style=\"margin-top:3px;font-family:'Space Grotesk';font-weight:700;font-size:20px;letter-spacing:-0.3px;\">Liftoff Mix<\/div>\n            <div style=\"margin-top:2px;font-size:12px;color:rgba(242,245,243,0.45);\">{{ trackCount }} tracks \u00b7 gym energy<\/div>\n          <\/div>\n        <\/div>\n        <button onclick=\"{{ playPlaylist }}\" style=\"margin-top:16px;width:100%;background:#3CE08A;color:#06140D;font-family:'Space Grotesk';font-weight:700;font-size:15px;border:none;border-radius:14px;padding:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;\">\n          <div style=\"width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:12px solid #06140D;\"><\/div> Play workout mix\n        <\/button>\n        <div style=\"margin-top:16px;background:#0E1110;border:1px solid rgba(255,255,255,0.06);border-radius:16px;overflow:hidden;\">\n          <sc-for list=\"{{ tracks }}\" as=\"t\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;align-items:center;gap:13px;padding:12px 15px;border-bottom:1px solid rgba(255,255,255,0.05);\">\n              <div style=\"font-family:'JetBrains Mono';font-size:12px;color:rgba(242,245,243,0.35);width:16px;text-align:center;flex-shrink:0;\">{{ t.i }}<\/div>\n              <div style=\"flex:1;min-width:0;\"><div style=\"font-family:'Space Grotesk';font-weight:600;font-size:14.5px;\">{{ t.title }}<\/div><div style=\"margin-top:1px;font-size:12px;color:rgba(242,245,243,0.45);\">{{ t.artist }}<\/div><\/div>\n              <div style=\"font-family:'JetBrains Mono';font-size:11px;color:rgba(242,245,243,0.35);flex-shrink:0;\">{{ t.len }}<\/div>\n            <\/div>\n          <\/sc-for>\n        <\/div>\n        <button onclick=\"{{ disconnect }}\" style=\"margin-top:14px;background:none;border:none;color:rgba(242,245,243,0.4);font-family:'Space Grotesk';font-size:13px;cursor:pointer;\">Disconnect<\/button>\n      <\/div>\n      <\/sc-if>\n\n      <!-- connect prompt -->\n      <sc-if value=\"{{ notConnected }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"margin-top:20px;\">\n        <h1 style=\"font-family:'Space Grotesk';font-weight:700;font-size:26px;letter-spacing:-0.5px;margin:0;\">Bring your own fire.<\/h1>\n        <p style=\"margin:8px 0 0;font-size:14px;line-height:1.5;color:rgba(242,245,243,0.55);\">Link a service to pull your gym playlist straight into your sessions.<\/p>\n        <div style=\"margin-top:18px;display:flex;flex-direction:column;gap:10px;\">\n          <sc-for list=\"{{ services }}\" as=\"sv\" hint-placeholder-count=\"3\">\n            <button onclick=\"{{ sv.onConnect }}\" style=\"display:flex;align-items:center;gap:14px;width:100%;background:#0E1110;border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:14px 16px;cursor:pointer;\">\n              <div style=\"width:40px;height:40px;border-radius:11px;background:{{ sv.color }};display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;font-size:19px;color:#fff;flex-shrink:0;\">{{ sv.glyph }}<\/div>\n              <div style=\"flex:1;text-align:left;font-family:'Space Grotesk';font-weight:600;font-size:15px;color:#F2F5F3;\">Connect {{ sv.name }}<\/div>\n              <span style=\"color:rgba(242,245,243,0.3);font-size:18px;\">\u203a<\/span>\n            <\/button>\n          <\/sc-for>\n        <\/div>\n      <\/div>\n      <\/sc-if>\n\n      <!-- hype audio library -->\n      <div style=\"margin-top:30px;display:flex;align-items:center;gap:10px;\">\n        <div style=\"font-family:'Space Grotesk';font-weight:700;font-size:18px;letter-spacing:-0.3px;\">No playlist? Lock in with hype audio.<\/div>\n      <\/div>\n      <p style=\"margin:6px 0 0;font-size:13px;color:rgba(242,245,243,0.5);line-height:1.45;\">Tough-love motivation, read out loud to carry you through the set.<\/p>\n      <div style=\"margin-top:16px;display:flex;flex-direction:column;gap:10px;\">\n        <sc-for list=\"{{ audioView }}\" as=\"v\" hint-placeholder-count=\"6\">\n          <div onclick=\"{{ v.onPlay }}\" style=\"display:flex;gap:14px;background:{{ v.bg }};border:1px solid {{ v.border }};border-radius:16px;padding:13px;cursor:pointer;align-items:center;\">\n            <div style=\"width:50px;height:50px;border-radius:13px;flex-shrink:0;position:relative;background:{{ v.art }};display:flex;align-items:center;justify-content:center;\">\n              <sc-if value=\"{{ v.isPlaying }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;align-items:flex-end;gap:2.5px;height:18px;\">{{ v.eq }}<\/div>\n              <\/sc-if>\n              <sc-if value=\"{{ v.notPlaying }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"width:0;height:0;border-top:8px solid transparent;border-bottom:8px solid transparent;border-left:13px solid #06140D;margin-left:3px;\"><\/div>\n              <\/sc-if>\n            <\/div>\n            <div style=\"flex:1;min-width:0;\">\n              <div style=\"font-family:'JetBrains Mono';font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:#3CE08A;\">{{ v.tag }}<\/div>\n              <div style=\"margin-top:4px;font-family:'Space Grotesk';font-weight:600;font-size:15px;line-height:1.2;\">{{ v.title }}<\/div>\n            <\/div>\n            <sc-if value=\"{{ v.hasFile }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-family:'JetBrains Mono';font-size:8.5px;letter-spacing:1px;color:#06140D;background:#3CE08A;padding:3px 7px;border-radius:5px;flex-shrink:0;\">REAL<\/div>\n            <\/sc-if>\n            <div style=\"font-family:'JetBrains Mono';font-size:11px;color:rgba(242,245,243,0.4);flex-shrink:0;\">{{ v.len }}<\/div>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n      <div style=\"margin-top:16px;font-family:'JetBrains Mono';font-size:9.5px;line-height:1.4;color:rgba(242,245,243,0.3);text-align:center;\">Tap a track, then upload a real voice file in the player. Spoken text is the fallback. Playlist linking is a demo connection.<\/div>\n    <\/div>\n    <\/sc-if>\n\n    <!-- PLAYER -->\n    <sc-if value=\"{{ soundPlayer }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:64px 20px 40px;\">\n      <button onclick=\"{{ backToSound }}\" style=\"display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.09);color:#F2F5F3;border-radius:999px;padding:9px 16px 9px 12px;font-family:'Space Grotesk';font-size:13px;font-weight:500;cursor:pointer;\"><span style=\"font-size:16px;line-height:1;\">\u2190<\/span> Soundtrack<\/button>\n\n      <!-- art -->\n      <div style=\"margin-top:22px;border-radius:24px;aspect-ratio:1/1;background:{{ nowArt }};position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,0.08);\">\n        <div style=\"position:absolute;inset:0;background:radial-gradient(circle at 50% 30%, rgba(60,224,138,0.25), transparent 60%);\"><\/div>\n        <div style=\"display:flex;align-items:flex-end;gap:5px;height:80px;\">{{ bigEq }}<\/div>\n        <div style=\"position:absolute;bottom:18px;left:0;right:0;text-align:center;font-family:'JetBrains Mono';font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(6,20,13,0.55);\">Ilitest Hype<\/div>\n      <\/div>\n\n      <div style=\"margin-top:22px;font-family:'JetBrains Mono';font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:#3CE08A;\">{{ nowTag }}<\/div>\n      <h2 style=\"font-family:'Space Grotesk';font-weight:700;font-size:23px;line-height:1.18;letter-spacing:-0.4px;margin:8px 0 0;\">{{ nowTitle }}<\/h2>\n\n      <!-- live transcript / real-voice state -->\n      <sc-if value=\"{{ noRealVoice }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"margin-top:16px;min-height:48px;font-size:15px;line-height:1.5;color:rgba(242,245,243,0.78);font-style:italic;\">{{ nowLine }}<\/div>\n      <\/sc-if>\n      <sc-if value=\"{{ hasRealVoice }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:16px;min-height:48px;display:flex;align-items:center;gap:9px;font-family:'JetBrains Mono';font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#3CE08A;\"><span style=\"width:8px;height:8px;border-radius:50%;background:#3CE08A;\"><\/span> Playing your real voice file<\/div>\n      <\/sc-if>\n\n      <!-- progress -->\n      <div style=\"margin-top:10px;height:5px;border-radius:999px;background:rgba(255,255,255,0.1);overflow:hidden;\"><div style=\"height:100%;width:{{ audioPct }};background:#3CE08A;border-radius:999px;transition:width .25s linear;\"><\/div><\/div>\n      <div style=\"margin-top:8px;display:flex;align-items:center;justify-content:space-between;font-family:'JetBrains Mono';font-size:11px;color:rgba(242,245,243,0.4);\"><span>{{ elapsedLabel }}<\/span><span>{{ nowLen }}<\/span><\/div>\n\n      <!-- controls -->\n      <div style=\"margin-top:18px;display:flex;align-items:center;justify-content:center;gap:28px;\">\n        <button onclick=\"{{ prevAudio }}\" style=\"background:none;border:none;cursor:pointer;color:#F2F5F3;display:flex;align-items:center;\">\n          <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"#F2F5F3\"><path d=\"M6 6h2v12H6zm3.5 6 8.5 6V6z\"><\/path><\/svg>\n        <\/button>\n        <button onclick=\"{{ togglePlay }}\" style=\"width:68px;height:68px;border-radius:50%;background:#3CE08A;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(60,224,138,0.3);\">\n          <sc-if value=\"{{ audioPlaying }}\" hint-placeholder-val=\"{{ false }}\">\n            <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"#06140D\"><rect x=\"6\" y=\"5\" width=\"4\" height=\"14\" rx=\"1\"><\/rect><rect x=\"14\" y=\"5\" width=\"4\" height=\"14\" rx=\"1\"><\/rect><\/svg>\n          <\/sc-if>\n          <sc-if value=\"{{ audioPaused }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"width:0;height:0;border-top:11px solid transparent;border-bottom:11px solid transparent;border-left:18px solid #06140D;margin-left:4px;\"><\/div>\n          <\/sc-if>\n        <\/button>\n        <button onclick=\"{{ nextAudio }}\" style=\"background:none;border:none;cursor:pointer;color:#F2F5F3;display:flex;align-items:center;\">\n          <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"#F2F5F3\"><path d=\"M16 6h2v12h-2zm-9.5 6L15 6v12z\"><\/path><\/svg>\n        <\/button>\n      <\/div>\n\n      <label style=\"margin-top:22px;display:flex;align-items:center;justify-content:center;gap:9px;width:100%;box-sizing:border-box;background:rgba(60,224,138,0.1);border:1px solid rgba(60,224,138,0.25);color:#3CE08A;font-family:'Space Grotesk';font-weight:600;font-size:14px;border-radius:14px;padding:14px;cursor:pointer;\">\n        <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3CE08A\" stroke-width=\"2.1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 16V4\"><\/path><path d=\"m7 9 5-5 5 5\"><\/path><path d=\"M5 20h14\"><\/path><\/svg>\n        {{ uploadLabel }}\n        <input type=\"file\" accept=\"audio/*\" onchange=\"{{ uploadCurrent }}\" style=\"display:none\">\n      <\/label>\n      <div style=\"margin-top:9px;font-size:11.5px;line-height:1.45;color:rgba(242,245,243,0.4);text-align:center;\">Drop in an MP3/M4A you own or have rights to \u2014 it plays the real voice instead of the spoken text.<\/div>\n\n      <div style=\"margin-top:26px;font-family:'Space Grotesk';font-weight:600;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:rgba(242,245,243,0.5);\">Up next<\/div>\n      <div style=\"margin-top:12px;display:flex;flex-direction:column;gap:10px;\ ize:30px;letter-spacing:-0.6px;margin:18px 0 0;text-wrap:balance;\">Block the noise.<br>Earn the session.<\/h1>\n      <p style=\"margin:10px 0 0;font-size:14.5px;line-height:1.5;color:rgba(242,245,243,0.55);\">Pick the apps that derail you. They stay locked until your workout timer hits zero.<\/p>\n\n      <div style=\"margin-top:26px;display:flex;align-items:center;justify-content:space-between;\">\n        <div style=\"font-family:'Space Grotesk';font-weight:600;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:rgba(242,245,243,0.5);\">Apps to block<\/div>\n        <button onclick=\"{{ toggleAll }}\" style=\"background:none;border:none;color:#3CE08A;font-family:'Space Grotesk';font-size:13px;font-weight:600;cursor:pointer;\">{{ allLabel }}<\/button>\n      <\/div>\n      <div style=\"margin-top:14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;\">\n        <sc-for list=\"{{ appTiles }}\" as=\"a\" hint-placeholder-count=\"9\">\n          <div onclick=\"{{ a.onToggle }}\" style=\"position:relative;background:{{ a.bg }};border:1.5px solid {{ a.border }};border-radius:16px;padding:14px 8px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;\">\n            <div style=\"width:42px;height:42px;border-radius:12px;background:{{ a.color }};display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;font-size:18px;color:{{ a.glyphColor }};\">{{ a.glyph }}<\/div>\n            <div style=\"font-size:11px;font-weight:500;color:rgba(242,245,243,0.85);text-align:center;line-height:1.1;\">{{ a.name }}<\/div>\n            <sc-if value=\"{{ a.on }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"position:absolute;top:8px;right:8px;width:18px;height:18px;border-radius:50%;background:#3CE08A;display:flex;align-items:center;justify-content:center;color:#06140D;font-size:11px;font-weight:700;\">\u2713<\/div>\n            <\/sc-if>\n          <\/div>\n        <\/sc-for>\n der-radius:16px;padding:15px;cursor:pointer;\">End session early<\/button>\n    <\/div>\n    <\/sc-if>\n\n    <!-- BLOCKED INTERSTITIAL -->\n    <sc-if value=\"{{ focusBlocked }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute;inset:0;background:rgba(6,8,7,0.92);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 32px;z-index:5;\">\n      <div style=\"width:84px;height:84px;border-radius:26px;background:rgba(60,224,138,0.12);border:1px solid rgba(60,224,138,0.3);display:flex;align-items:center;justify-content:center;\">\n        <svg width=\"38\" height=\"38\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3CE08A\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"9\" rx=\"2\"><\/rect><path d=\"M8 11V8a4 4 0 0 1 8 0v3\"><\/path><\/svg>\n      <\/div>\n      <h2 style=\"font-family:'Space Grotesk';font-weight:700;font-size:24px;letter-spacing:-0.4px;margin:24px 0 0;\">{{ blockedApp }} is locked<\/h2>\n      <p style=\"margin:10px 0 0;font-size:14.5px;line-height:1.55;color:rgba(242,245,243,0.6);max-width:260px;\">Nothing on there beats what you're building right now. Back to the set \u2014 <span style=\"color:#3CE08A;font-weight:600;\">{{ clock }}<\/span> left.<\/p>\n      <button onclick=\"{{ dismissBlocked }}\" style=\"margin-top:28px;background:#3CE08A;color:#06140D;font-family:'Space Grotesk';font-weight:700;font-size:15px;border:none;border-radius:14px;padding:15px 32px;cursor:pointer;\">Back to training<\/button>\n    <\/div>\n    <\/sc-if>\n\n    <!-- DONE -->\n    <sc-if value=\"{{ focusDone }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 32px;\">\n      <div style=\"width:96px;height:96px;border-radius:50%;background:rgba(60,224,138,0.13);border:1px solid rgba(60,224,138,0.3);display:flex;align-items:center;justify-content:center;\">\n        <svg width=\"46\" height=\"46\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3CE08A\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\/path><\/svg>\n      <\/div>\n      <h2 style=\"font-family:'Space Grotesk';font-weight:700;font-size:28px;letter-spacing:-0.5px;margin:26px 0 0;\">{{ doneTitle }}<\/h2>\n      <p style=\"margin:10px 0 0;font-size:15px;line-height:1.55;color:rgba(242,245,243,0.6);max-width:280px;\">{{ doneMsg }}<\/p>\n      <div style=\"margin-top:24px;display:flex;gap:24px;\">\n        <div><div style=\"font-family:'Space Grotesk';font-weight:700;font-size:26px;color:#3CE08A;\">{{ doneMins }}<\/div><div style=\"font-family:'JetBrains Mono';font-size:9px;letter-spacing:1px;color:rgba(242,245,243,0.4);margin-top:2px;\">MIN FOCUSED<\/div><\/div>\n        <div><div style=\"font-family:'Space Grotesk';font-weight:700;font-size:26px;color:#3CE08A;\">{{ blockedCount }}<\/div><div style=\"font-family:'JetBrains Mono';font-size:9px;letter-spacing:1px;color:rgba(242,245,243,0.4);margin-top:2px;\">APPS BLOCKED<\/div><\/div>\n      <\/div>\n      <button onclick=\"{{ closeFocus }}\" style=\"margin-top:34px;width:100%;max-width:280px;background:#3CE08A;color:#06140D;font-family:'Space Grotesk';font-weight:700;font-size:16px;border:none;border-radius:16px;padding:17px;cursor:pointer;\">Done<\/button>\n    <\/div>\n    <\/sc-if>\n\n  <\/div>\n  <\/sc-if>\n\n  <!-- ============ NUTRITION COACH FAB ============ -->\n  <sc-if value=\"{{ inApp }}\" hint-placeholder-val=\"{{ false }}\">\n  <button onclick=\"{{ openBot }}\" style=\"position:absolute;right:16px;bottom:108px;z-index:45;width:58px;height:58px;border-radius:20px;border:1px solid rgba(60,224,138,0.4);background:linear-gradient(150deg,#3CE08A,#1c7a4a);box-shadow:0 10px 30px rgba(60,224,138,0.35);cursor:pointer;display:flex;align-items:center;justify-content:center;\">\n    <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#06140D\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7A8.38 8.38 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3 8.38 8.38 0 0 1 21 11.5z\"><\/path><\/svg>\n  <\/button>\n  <\/sc-if>\n\n  <!-- ============ NUTRITION COACH OVERLAY ============ -->\n  <sc-if value=\"{{ botOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:absolute;inset:0;z-index:70;background:#070908;color:#F2F5F3;display:flex;flex-direction:column;\">\n    <div style=\"padding:54px 18px 14px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;gap:13px;background:#0a0d0c;\">\n      <div style=\"width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#3CE08A,#1c7a4a);display:flex;align-items:center;justify-content:center;flex-shrink:0;\">\n        <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#06140D\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3a9 9 0 0 0-9 9c0 1.6.4 3 1.1 4.3L3 21l4.7-1.1A9 9 0 1 0 12 3z\"><\/path><path d=\"M8 12h.01M12 12h.01M16 12h.01\"><\/path><\/svg>\n      <\/div>\n      <div style=\"flex:1;\">\n        <div style=\"font-family:'Space Grotesk';font-weight:700;font-size:17px;letter-spacing:-0.3px;\">Nutrition Coach<\/div>\n        <div style=\"font-family:'JetBrains Mono';font-size:10px;color:#3CE08A;margin-top:1px;\">Personalized to your stats<\/div>\n      <\/div>\n      <button onclick=\"{{ closeBot }}\" style=\"background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.09);color:#F2F5F3;border-radius:999px;width:38px;height:38px;font-size:17px;cursor:pointer;\">\u00d7<\/button>\n    <\/div>\n\n    <div style=\"flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;\">\n      <sc-if value=\"{{ botEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"margin-top:8px;\">\n        <div style=\"background:#161A18;border:1px solid rgba(255,255,255,0.06);border-radius:16px 16px 16px 4px;padding:14px 16px;font-size:14px;line-height:1.55;color:rgba(242,245,243,0.85);max-width:88%;\">Hey Alex \u2014 I know your goal, calorie target and protein needs. Ask me anything about what to eat, timing, or how to hit your numbers today.<\/div>\n        <div style=\"margin-top:16px;display:flex;flex-direction:column;gap:9px;\">\n          <button onclick=\"{{ askProtein }}\" style=\"text-align:left;background:rgba(60,224,138,0.06);border:1px solid rgba(60,224,138,0.16);color:#F2F5F3;border-radius:13px;padding:13px 15px;font-size:13.5px;font-family:'Space Grotesk';cursor:pointer;\">How much protein should I eat today?<\/button>\n          <button onclick=\"{{ askDeficit }}\" style=\"text-align:left;background:rgba(60,224,138,0.06);border:1px solid rgba(60,224,138,0.16);color:#F2F5F3;border-radius:13px;padding:13px 15px;font-size:13.5px;font-family:'Space Grotesk';cursor:pointer;\">Is my calorie target right for my goal?<\/button>\n          <button onclick=\"{{ askMeal }}\" style=\"text-align:left;background:rgba(60,224,138,0.06);border:1px solid rgba(60,224,138,0.16);color:#F2F5F3;border-radius:13px;padding:13px 15px;font-size:13.5px;font-family:'Space Grotesk';cursor:pointer;\">Give me a high-protein meal idea.<\/button>\n        <\/div>\n      <\/div>\n      <\/sc-if>\n      <sc-for list=\"{{ botView }}\" as=\"m\" hint-placeholder-count=\"0\">\n        <div style=\"align-self:{{ m.align }};max-width:88%;background:{{ m.bg }};color:{{ m.color }};border-radius:16px;padding:12px 15px;font-size:14px;line-height:1.55;white-space:pre-wrap;\">{{ m.content }}<\/div>\n      <\/sc-for>\n      <sc-if value=\"{{ botLoading }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"align-self:flex-start;background:#161A18;border-radius:16px;padding:14px 18px;display:flex;gap:5px;\">\n Mono';font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#3CE08A;\">Workouts<\/div>\n        <button onclick=\"{{ closeWorkout }}\" style=\"background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.09);color:#F2F5F3;border-radius:999px;width:38px;height:38px;font-size:17px;cursor:pointer;\">\u00d7<\/button>\n      <\/div>\n      <h1 style=\"font-family:'Space Grotesk';font-weight:700;font-size:30px;letter-spacing:-0.6px;margin:14px 0 0;\">Build the body.<\/h1>\n      <p style=\"margin:8px 0 0;font-size:14px;color:rgba(242,245,243,0.55);\">{{ workoutModeLabel }}<\/p>\n\n      <!-- toggle -->\n      <div style=\"margin-top:20px;display:flex;background:#0E1110;border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:5px;gap:5px;\">\n        <button onclick=\"{{ setCalis }}\" style=\"flex:1;border:none;cursor:pointer;border-radius:10px;padding:12px;font-family:'Space Grotesk';font-weight:600;font-size:14px;background:{{ calisTabBg }};color:{{ calisTabColor }};\">Calisthenics<\/button>\n        <button onclick=\"{{ setGym }}\" style=\"flex:1;border:none;cursor:pointer;border-radius:10px;padding:12px;font-family:'Space Grotesk';font-weight:600;font-size:14px;background:{{ gymTabBg }};color:{{ gymTabColor }};\">Gym<\/button>\n      <\/div>\n\n      <div style=\"margin-top:18px;display:flex;flex-direction:column;gap:12px;\">\n        <sc-for list=\"{{ wkList }}\" as=\"ex\" hint-placeholder-count=\"6\">\n          <div onclick=\"{{ ex.onOpen }}\" style=\"background:#0E1110;border:1px solid rgba(255,255,255,0.06);border-radius:18px;padding:17px;cursor:pointer;\">\n            <div style=\"display:flex;align-items:center;gap:13px;\">\n              <div style=\"width:46px;height:46px;border-radius:13px;background:rgba(60,224,138,0.1);border:1px solid rgba(60,224,138,0.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;\">\n                <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3CE08

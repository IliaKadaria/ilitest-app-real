tesk';font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;\">{{ st.n }}<\/div>\n            <div style=\"flex:1;padding-top:1px;\">\n              <div style=\"font-family:'Space Grotesk';font-weight:600;font-size:15.5px;\">{{ st.t }}<\/div>\n              <div style=\"margin-top:4px;font-size:13.5px;line-height:1.5;color:rgba(242,245,243,0.6);\">{{ st.d }}<\/div>\n            <\/div>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n\n      <div style=\"margin-top:24px;font-family:'Space Grotesk';font-weight:600;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:rgba(242,245,243,0.45);\">Form cues<\/div>\n      <div style=\"margin-top:12px;display:flex;flex-direction:column;gap:9px;\">\n        <sc-for list=\"{{ wkDetailCues }}\" as=\"c\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;gap:11px;align-items:flex-start;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:13px;padding:12px 14px;\">\n            <span style=\"color:#3CE08A;flex-shrink:0;font-size:15px;line-height:1.3;\">\u2022<\/span>\n            <div style=\"font-size:13.5px;line-height:1.45;color:rgba(242,245,243,0.78);\">{{ c }}<\/div>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n\n      <sc-if value=\"{{ isGym }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:24px;font-family:'Space Grotesk';font-weight:600;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:rgba(242,245,243,0.45);\">Sets &amp; reps<\/div>\n      <div style=\"margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:11px;\">\n        <div style=\"background:#0E1110;border:1px solid rgba(60,224,138,0.22);border-radius:16px;padding:16px;\">\n          <div style=\"display:flex;align-items:center;gap:7px;\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3CE08A\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 6.5 17.5 17.5\"><\/path><rect x=\"4\" y=\"9\" width=\"3.5\" height=\"6\" rx=\"1\" transform=\"rotate(-45 6 12)\"><\/rect><rect x=\"16.5\" y=\"9\" width=\"3.5\" height=\"6\" rx=\"1\" transform=\"rotate(-45 18 12)\"><\/rect><\/svg>\n            <div style=\"font-family:'JetBrains Mono';font-size:10px;letter-spacing:0.5px;text-transform:uppercase;color:#3CE08A;\">More muscle<\/div>\n          <\/div>\n          <div style=\"margin-top:10px;font-family:'Space Grotesk';font-weight:700;font-size:21px;letter-spacing:-0.4px;\">2 sets<\/div>\n          <div style=\"margin-top:3px;font-size:13px;color:rgba(242,245,243,0.6);\">taken to failure<\/div>\n          <div style=\"margin-top:10px;font-family:'JetBrains Mono';font-size:10px;line-height:1.45;color:rgba(242,245,243,0.4);\">Push each set until you can't complete another clean rep.<\/div>\n        <\/div>\n        <div style=\"background:#0E1110;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:16px;\">\n          <div style=\"display:flex;align-items:center;gap:7px;\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7FE9FF\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m12 2 2.5 5 5.5.8-4 3.9.9 5.5L12 20l-4.9 2.6.9-5.5-4-3.9 5.5-.8L12 2z\"><\/path><\/svg>\n            <div style=\"font-family:'JetBrains Mono';font-size:10px;letter-spacing:0.5px;text-transform:uppercase;color:#7FE9FF;\">Strength<\/div>\n          <\/div>\n          <div style=\"margin-top:10px;font-family:'Space Grotesk';font-weight:700;font-size:21px;letter-spacing:-0.4px;\">3 \u00d7 8<\/div>\n          <div style=\"margin-top:3px;font-size:13px;color:rgba(242,245,243,0.6);\">3 sets of 8 reps<\/div>\n          <div style=\"margin-top:10px;font-family:'JetBrains Mono';font-size:10px;line-height:1.45;color:rgba(242,245,243,0.4);\">Heavier load, 2-3 min rest, leave 1-2 reps in reserve.<\/div>\n        <\/div>\n      <\/div>\n      <\/sc-if>\n\n      <button onclick=\"{{ completeWorkoutNow }}\" style=\"margin-top:24px;width:100%;background:#3CE08A;color:#06140D;font-family:'Space Grotesk';font-weight:700;font-size:16px;border:none;border-radius:16px;padding:16px;cursor:pointer;\">{{ completeLabel }}<\/button>\n      <div style=\"margin-top:12px;font-family:'JetBrains Mono';font-size:9.5px;line-height:1.5;color:rgba(242,245,243,0.3);text-align:center;\">Marking a session complete counts toward today's streak.<\/div>\n    <\/div>\n    <\/sc-if>\n  <\/div>\n  <\/sc-if>\n\n  <!-- ============ RANK OVERLAY ============ -->\n  <sc-if value=\"{{ rankOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:absolute;inset:0;z-index:65;background:radial-gradient(circle at 50% 0%, #12130d, #060807 60%);color:#F2F5F3;overflow-y:auto;\">\n    <div style=\"padding:54px 20px 48px;\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;\">\n        <div style=\"font-family:'JetBrains Mono';font-size:11px;letter-spacing:2px;text-transform:uppercase;color:{{ rankColor }};\">Your rank<\/div>\n        <button onclick=\"{{ closeRank }}\" style=\"background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.09);color:#F2F5F3;border-radius:999px;width:38px;height:38px;font-size:17px;cursor:pointer;\">\u00d7<\/button>\n      <\/div>\n\n      <!-- current rank hero -->\n      <div style=\"margin-top:18px;border-radius:24px;border:1px solid {{ rankBorder }};background:linear-gradient(160deg,#11140d,#0a0d0c);padding:28px 22px;text-align:center;position:relative;overflow:hidden;\">\n        <div style=\"position:absolute;top:-50px;left:50%;transform:translateX(-50%);width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,{{ rankSoft }},transparent 65%);\"><\/div>\n        <div style=\"position:relative;width:96px;height:96px;margin:0 auto;border-radius:26px;background:{{ rankSoft }};border:1.5px solid {{ rankBorder }};display:flex;align-items:center;justify-content:center;\">\n          <svg width=\"52\" height=\"52\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"url(#lgHero)\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"filter:drop-shadow(0 0 12px {{ rankColor }});\"><defs><linearGradient id=\"lgHero\" x1=\"0\" y1=\"0\" x2=\"24\" y2=\"24\" gradientUnits=\"userSpaceOnUse\"><stop offset=\"0\" stop-color=\"{{ rankC1 }}\"><\/stop><stop offset=\"0.5\" stop-color=\"{{ rankC2 }}\"><\/stop><stop offset=\"1\" stop-color=\"{{ rankC3 }}\"><\/stop><\/linearGradient><\/defs><path d=\"{{ rankIconPath }}\"><\/path><\/svg>\n        <\/div>\n        <div style=\"position:relative;margin-top:18px;font-family:'JetBrains Mono';font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(242,245,243,0.5);\">{{ rankTier }}<\/div>\n        <div style=\"position:relative;margin-top:6px;font-family:'Space Grotesk';font-weight:700;font-size:34px;letter-spacing:-0.8px;color:{{ rankColor }};\">{{ rankName }}<\/div>\n      <\/div>\n\n      <!-- countdown to next -->\n      <sc-if value=\"{{ rankHasNext }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"margin-top:16px;background:#0E1110;border:1px solid rgba(255,255,255,0.06);border-radius:20px;padding:20px;\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;\">\n          <div style=\"font-family:'JetBrains Mono';font-size:10px;letter-spacing:1px;text-transform:uppercase;color:rgba(242,245,243,0.45);\">Next rank<\/div>\n          <div style=\"font-family:'Space Grotesk';font-weight:600;font-size:14px;\">{{ nextRankName }}<\/div>\n        <\/div>\n        <div style=\"margin-top:14px;height:8px;border-radius:999px;background:rgba(255,255,255,0.08);overflow:hidden;\"><div style=\"height:100%;width:{{ rankProgressW }};background:{{ rankColor }};border-radius:999px;\"><\/div><\/div>\n        <div style=\"margin-top:14px;text-align:center;\">\n          <div style=\"font-family:'Space Grotesk';font-wei .resolve(__sbClient);\n    if (!__sbConfigPromise) __sbConfigPromise = fetch('/api/config').then(function(r) { return r.json(); });\n    return __sbConfigPromise.then(function(cfg) {\n      if (!cfg || !cfg.url || !cfg.anonKey) throw new Error('Supabase is not configured yet');\n      __sbClient = window.supabase.createClient(cfg.url, cfg.anonKey);\n      return __sbClient;\n    });\n  }\n  function aiComplete(input) {\n    var messages = typeof input === 'string' ? [{ role: 'user', content: input }] : input.messages;\n    return getSupabase().then(function(sb) { return sb.auth.getSession(); }).then(function(res) {\n      var token = res && res.data && res.data.session && res.data.session.access_token;\n      if (!token) throw new Error('Sign in to use AI features');\n      return fetch('/api/chat', {\n        method: 'POST',\n        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },\n        body: JSON.stringify({ messages: messages }),\n      });\n    }).then(function(r) {\n      if (!r.ok) throw new Error('AI request failed');\n      return r.json();\n    }).then(function(data) { return data.text; });\n  }\n<\/script>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    phase: 'welcome',\n    ob: { step:0, goal:null, motives:[], weight:82, height:182, age:28, bf:'15-19', days:4 },\n    tab: 'home',\n    article: null,\n    cat: 'All',\n    done: { sun:false, supp:false, lift:false, sleep:true, protein:true, alc:false },\n    scan: { status:'idle', image:null, data:null, error:null },\n    query: '',\n    log: [],\n    learned: [],\n    aiLoading: false,\n    focus: { open:false, status:'setup', mins:45, remaining:0, blockedApp:null,\n      apps:{ instagram:true, tiktok:true, youtube:true, x:true, snapchat:true, reddit:true, facebook:false, netflix:false, discord:false } },\n    sound: { open:false, view:'main', service:null, audio:null, playing:false, line:'', lineIdx:0, elapsed:0  id:'sleep', cat:'Sleep', type:'video', read:'4 min', imgLabel:'video \u00b7 sleep cycles',\n      title:'Sleep Is the Foundation of Testosterone',\n      body:[\n        'Testosterone is produced on a daily rhythm that peaks in the early morning, and most of that release happens while you sleep \u2014 tightly linked to your deep and REM cycles.',\n        'In a controlled study, restricting healthy young men to 5 hours of sleep for one week lowered their daytime testosterone by 10\u201315%. That is the kind of drop that normally takes 10\u201315 years of aging.',\n        'Protect a consistent 7\u20139 hour window. Keep the room cold and dark, cut screens before bed, and treat sleep as non-negotiable training for your hormones.'\n      ],\n      takeaways:['Most testosterone is released during sleep','One week at 5h dropped T by 10\u201315%','Aim for 7\u20139 consistent hours'],\n      evidence:'Leproult & Van Cauter, JAMA 2011' },\n    { id:'lifts', cat:'Training', type:'video', read:'5 min', imgLabel:'video \u00b7 the big lifts',\n      title:'The Lifts That Actually Move the Needle',\n      body:[\n        'Big, multi-joint lifts \u2014 squats, deadlifts, presses, rows and pull-ups \u2014 recruit the most muscle mass and trigger the largest acute hormonal response after a session.',\n        'Train in the 75\u201385% of 1RM range for 4\u20136 hard sets per major movement, with moderate rest. Large muscle groups like legs and back drive more of the response than isolation work.',\n        'One honest caveat: those post-workout testosterone spikes are small and short-lived. The real win is consistent progressive overload, enough recovery, and not digging yourself into an overtraining hole.'\n      ],\n      takeaways:['Prioritize compound, multi-joint lifts','Heavy-ish loads, large muscle groups','Consistency beats chasing acute spikes'],\n      evidence:'Reviewed in Sports Medicine \u2014 resistance training & endocrine response' },\n    { id:'fat', cat:'Diet', type:'read', read:'4 min', imgLabel:'read \u00b7 dietary fat',\n      title:\"Don't Fear Dietary Fat\",\n      body:[\n        'Dietary fat is a raw material for testosterone. Diets that cut fat very low \u2014 under about 20% of calories \u2014 modestly reduce testosterone compared with higher-fat eating.',\n        'You do not need to drown in fat. Include whole-food sources: eggs, olive oil, fatty fish, nuts and moderate red meat. Both monounsaturated and some saturated fat play a role.',\n        'The lesson is balance, not extremes. Crash low-fat dieting can quietly cost you hormones along with the weight.'\n      ],\n      takeaways:['Very low-fat diets lower T modestly','Eat whole-food fats: eggs, olive oil, fish','Balance beats extremes'],\n      evidence:'Whittaker & Wu, J. Steroid Biochem. Mol. Biol. 2021 (meta-analysis)' },\n    { id:'micros', cat:'Diet', type:'read', read:'3 min', imgLabel:'read \u00b7 zinc & vitamin D',\n      title:'Zinc & Vitamin D: The Two That Matter',\n      body:[\n        'Two micronutrients show up again and again in testosterone research: zinc and vitamin D. A genuine deficiency in either is linked to lower testosterone.',\n        'Correcting a deficiency can restore your levels. But megadosing when you are already sufficient does almost nothing \u2014 more is not better here.',\n        'Get tested before supplementing. Food first: oysters, beef and pumpkin seeds for zinc; sunlight and fatty fish for vitamin D.'\n      ],\n      takeaways:['Deficiency in zinc or D lowers T','Fixing a deficiency helps; megadosing does not','Test, then eat for it before reaching for pills'],\n      evidence:'Multiple RCTs on zinc / vitamin D status and testosterone' },\n    { id:'fat2', cat:'Lifestyle', type:'read', read:'4 min', imgLabel:'read \u00b7 body composition',\n      title:'Body Fat Is a Hormone Problem',\n      body:[\n        'Fat tissue is not inert. It contains an enzyme called aromatase that converts testosterone into estrogen, so carrying excess body fat tilts your hormonal balance the wrong way.',\n        'Higher body fat \u2014 especially visceral fat around the organs \u2014 correlates with lower free testosterone. Losing that excess reliably improves your testosterone-to-estrogen ratio.',\n        'Aim for a sustainable deficit, not a crash. Extreme under-eating raises cortisol and can suppress testosterone too, so lean out patiently.'\n      ],\n      takeaways:['Fat tissue converts T into estrogen','Losing excess fat improves your T:E ratio','Sustainable deficit, not crash diets'],\n      evidence:'Observational & intervention data on adiposity and free T' },\n    { id:'alcohol', cat:'Lifestyle', type:'video', read:'5 min', imgLabel:'video \u00b7 stress & alcohol',\n      title:'Alcohol, Stress & the Cortisol Tax',\n      body:[\n        'Chronic stress keeps cortisol elevated, and cortisol works against testosterone by suppressing the signal from your brain to your testes \u2014 the HPG axis.',\n        'Heavy or frequent alcohol intake adds to the problem: it lowers testosterone and can nudge estrogen up. The occasional drink is not the issue; the pattern is.',\n        'Manage the inputs you control. Build in recovery, breathe, get outside, and keep alcohol occasional rather than habitual.'\n      ],\n      takeaways:['Chronic cortisol suppresses testosterone','Heavy alcohol lowers T over time','Recovery and moderation protect your levels'],\n      evidence:'Endocrine literature on the cortisol\u2013HPG axis & alcohol' },\n    { id:'protein', cat:'Diet', type:'read', read:'3 min', imgLabel:'read \u00b7 protein intake',\n      title:'Protein: Enough, Not Endless',\n      body:[\n        'Protein is essential for muscle and recovery, and most men chasing testosterone do not eat enough of it. A target of 1.6\u20132.2 g per kg of bodyweight covers nearly everyone.',\n        'But more is not infinitely better. Some studies link very high-protein, low-carb diets to lower testosterone and higher cortisol \u2014 likely because carbs and fats get crowded out.',\n        'Hit your protein, then leave room on the plate for quality carbs and fats. Your hormones need the whole meal, not just the chicken breast.'\n      ],\n      takeaways:['Aim for 1.6\u20132.2 g/kg protein','Do not crowd out carbs and fats','Whole, balanced meals beat protein-only'],\n      evidence:'Reviews on protein intake, cortisol & testosterone' },\n    { id:'overtrain', cat:'Training', type:'read', read:'4 min', imgLabel:'read \u00b7 recovery',\n      title:'Why Overtraining Backfires',\n      body:[\n        'Training is a stressor your body adapts to \u2014 but only if you recover. Pile on too much volume without rest and cortisol climbs while testosterone can fall.',\n        'This is the overreaching / overtraining zone: stalled progress, poor sleep, low drive and worse hormones. More sessions stop helping and start hurting.',\n        'Program deloads, defend your sleep, and eat enough to fuel the work. Recovery is where the adaptation \u2014 and the testosterone \u2014 actually happens.'\n      ],\n      takeaways:['Too much volume raises cortisol, lowers T','Watch for stalls, poor sleep, low drive','Deload, sleep and fuel to recover'],\n      evidence:'Overtraining syndrome & endocrine markers literature' },\n  ];\n\n  setTab = (t) => this.setState({ tab:t, article:null });\n  openArticle = (a) => this.setState({ article:a });\n  closeArticle = () => this.setState({ article:null });\n  setCat = (c) => this.setState({ cat:c });\n  toggle = (k) => this.setState(s => ({ done: { ...s.done, [k]: !s.done[k] } }));\n  resetScan = () => this.setState({ scan:{ status:'idle', image:null, data:null, error:null } });\n  onPick = (e) => { const f = e.target.files && e.target.files[0]; if (f) this.analyze(f); e.target.value=''; };\n  retry = () => { if (this._lastFile) this.analyze(this._lastFile); };\n\n  compress(file, max) {\n    max = max || 1100;\n    return new Promise((res, rej)
